[package]
name = "mdok-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "mdok"
path = "src/main.rs"

[dependencies]
mdok-core = { path = "../mdok-core" }
mdok-curl = { path = "../mdok-curl" }
mdok-command = { path = "../mdok-command" }
mdok-markdown = { path = "../mdok-markdown" }
mdok-template = { path = "../mdok-template" }
mdok-report = { path = "../mdok-report" }
mdok-postman = { path = "../mdok-postman" }
mdok-quickjs = { path = "../mdok-quickjs" }
clap.workspace = true
anyhow.workspace = true
base64.workspace = true
jmespath.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile.workspace = true
toml.workspace = true
url.workspace = true
walkdir.workspace = true
rmcp = { version = "2.2", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "time"] }
