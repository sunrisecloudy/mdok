[workspace]
resolver = "2"
members = [
  "crates/mdok-cli",
  "crates/mdok-core",
  "crates/mdok-markdown",
  "crates/mdok-template",
  "crates/mdok-shell",
  "crates/mdok-curl-sys",
  "crates/mdok-curl",
  "crates/mdok-jmespath",
  "crates/mdok-runtime",
  "crates/mdok-report",
  "crates/mdok-test-server",
  "crates/mdok-benchmarks",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
comrak = "0.54"
jmespath = { version = "0.5", features = ["sync"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "brotli", "cookies", "deflate", "gzip", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
url = "2"
walkdir = "2"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
