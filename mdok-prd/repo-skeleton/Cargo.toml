[workspace]
resolver = "2"
members = [
  "crates/mdok-cli",
  "crates/mdok-core",
  "crates/mdok-markdown",
  "crates/mdok-template",
  "crates/mdok-shell",
  "crates/mdok-curl-sys",
  "crates/mdok-curl",
  "crates/mdok-jmespath",
  "crates/mdok-runtime",
  "crates/mdok-report",
  "crates/mdok-test-server",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
comrak = "0.54"
jmespath = { version = "0.5", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
